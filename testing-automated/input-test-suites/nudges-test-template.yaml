name: "LNA Nova - Follow-up Nudge - {{DATETIME}}"
subjectType: AGENT
subjectName: {{AGENT_API_NAME}}

testCases:
  - utterance: "Draft a nudge email to a lead. Do not schedule the email. Your response should be a text-formatted email and not JSON."
    expectedTopic: sales_sdr_agent_FollowUpOutreach
    expectedActions:
      - GetRecordDetails
    expectedOutcome: "A nudge email is successfully drafted."
    contextVariables:
      - name: "$Context.OrchestrationStage"
        value: "Nudge"
      - name: "$Context.currentObjectApiName"
        value: "Lead"
      - name: "$Context.currentRecordId"
        value: "{{DYNAMIC_LEAD_RECORD_15_ID}}"
      - name: "$Context.ContactId"
        value: "{{DYNAMIC_LEAD_RECORD_15_ID}}"  
      - name: "$Context.isFinalMessage"
        value: false 
      - name: "$Context.emailBody"
        value: "{{PREVIOUS_EMAIL_BODY}}"
      - name: "$Context.actionCadenceStepTrackerId"
        value: "8HF000000000000"  
        